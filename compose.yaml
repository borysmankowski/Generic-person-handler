version: '3.8'

services:
  postgres:
    image: postgres:latest
    container_name: postgres-container
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin

  localstack:
    container_name: localstack-personmanagement
    image: localstack/localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - START_WEB=0
      - DEBUG=1
    volumes:
      - "./localstack/initialize_localstack.sh:/etc/localstack/init/ready.d/init-aws.sh"  # ready hook