spring:
  datasource:
    #    url: jdbc:h2:file:./data/sample;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: user
    password: user
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: true
    hibernate:
      ddl-auto: update  # or your preferred value
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        session_factory.statement_inspector: com.mickaelb.integration.hibernate.HibernateStatementInspector
        generate_statistics: true
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-file-size: 5000MB
      max-request-size: 5000MB
  integration:
    jdbc:
      initialize-schema: always
  upload:
    dir: "files-to-import"
file-queue-processor:
  batch-size: 20000
server:
  port: 8080
  tomcat:
    max-swallow-size: 5000MB
file-storage:
  solution: local
